<!DOCTYPE html>
<html>
<head>
    <title>Renewable Forecast Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .controls { text-align: center; margin-bottom: 20px; }
        input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-left: 10px; }
        button:hover { background-color: #219150; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); flex: 1; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>

    <h1>Renewable Energy Forecast Dashboard</h1>
    
    <div class="controls">
        <input type="text" id="locationInput" value="Toronto" placeholder="Enter city">
        <button onclick="getForecast()">Get Forecast</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>Weather Data</h2>
            <pre id="weatherOutput">Click the button to load...</pre>
        </div>
        <div class="card">
            <h2>Wind Forecast (MW)</h2>
            <pre id="windOutput">Click the button to load...</pre>
        </div>
        <div class="card">
            <h2>Solar Forecast (MW)</h2>
            <pre id="solarOutput">Click the button to load...</pre>
        </div>
    </div>

    <script>
        async function getForecast() {
            const location = document.getElementById('locationInput').value;
            
            document.getElementById('weatherOutput').innerText = "Loading...";
            document.getElementById('windOutput').innerText = "Loading...";
            document.getElementById('solarOutput').innerText = "Loading...";

            try {
                const response = await fetch(`/api/forecast?location=${location}`);
                const data = await response.json();

                document.getElementById('weatherOutput').innerText = JSON.stringify(data.weather.forecast, null, 2);
                document.getElementById('windOutput').innerText = JSON.stringify(data.wind_forecast.forecast, null, 2);
                document.getElementById('solarOutput').innerText = JSON.stringify(data.solar_forecast.forecast, null, 2);
            } catch (error) {
                console.error("Error:", error);
            }
        }
    </script>

</body>
</html>
